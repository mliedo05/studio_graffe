version: 2
updates:
  - package-ecosystem: bundler
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      rails:
        patterns:
          - "rails"
          - "action*"
          - "active*"
          - "sprockets*"
      security-patches:
        applies-to: security-updates
        update-types:
          - "patch"
          - "minor"
    versioning-strategy: lockfile-only

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
